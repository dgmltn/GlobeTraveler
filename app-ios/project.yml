name: GlobeTraveler
options:
  bundleIdPrefix: dev.doug
  deploymentTarget:
    iOS: "16.0"

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.25.1

targets:
  GlobeTraveler:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: GlobeTraveler
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: Shows an approximate you-are-here dot on the map.
    dependencies:
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.doug.globetraveler
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # Kotlin framework must be linked before MapLibre (maplibre-compose text rendering)
        OTHER_LDFLAGS: "$(inherited) -framework GlobeTravelerKit"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :app-ios:embedAndSignAppleFrameworkForXcode
